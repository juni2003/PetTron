# Canonical copy of .github/workflows/daily_agent.yml.
#
# If the live workflow ever needs changing, edit this file and copy it over —
# the workflow file itself can only be pushed by a token with the `workflow`
# scope, which the bot token does not have.
name: PetTron Daily Agent

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC (11:00 PKT)
  workflow_dispatch:
    inputs:
      diagnose_llm:
        description: "Run the Gemini/Groq self-test before the agent"
        type: boolean
        default: false

# Two runs must never race over state/run_state.json or the same branch.
concurrency:
  group: pettron-daily
  cancel-in-progress: false

jobs:
  run-pettron:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout PetTron repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # JavaScript repos are verified with their own npm lint/typecheck, so npm
      # has to exist here. Without this step every JS repo failed its baseline
      # check with 'npm: command not found' (exit 254).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Tick "diagnose_llm" on a manual run when something LLM-shaped looks off.
      - name: LLM self-test
        if: ${{ inputs.diagnose_llm == true }}
        env:
          PYTHONPATH: "."
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.llm_client

      - name: Run PetTron Agent
        env:
          PYTHONPATH: "."
          PYTHONUNBUFFERED: "1"
          # Only GEMINI_API_KEY: setting GOOGLE_API_KEY as well makes the SDK
          # warn about duplicates and possibly read the stale one.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PRIVATE_REPO_FOR_LOG: ${{ secrets.PRIVATE_REPO_FOR_LOG }}
        run: python -m src.main

      # Runs even when the agent step failed, so the keep-alive commit (which
      # stops GitHub disabling the schedule after 60 idle days) always lands.
      # Rebases onto anything that landed while the agent ran, and retries.
      - name: Commit updated run state (keep-alive)
        if: always()
        run: |
          git config user.name "pettron-bot[bot]"
          git config user.email "pettron-bot[bot]@users.noreply.github.com"
          git add state/run_state.json config/repos.yaml
          # Only commit if there are actual staged changes
          git diff --staged --quiet || git commit -m "chore: pettron daily run state update [skip ci]"
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "No state change to publish."
            exit 0
          fi
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt failed — retrying in 5s"
            sleep 5
          done
          echo "::error::Could not publish run state after 3 attempts"
          exit 1
