name: PetTron Daily Agent

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      diagnose_llm:
        description: "Run the Geminii/Groq self-test before the agent"
        type: boolean
        default: false

concurrency:
  group: pettron-daily
  cancel-in-progress: false

jobs:
  run-pettron:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout PetTron repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirments.txt
      - name: LLM self-test
        if: ${{ inputs.diagnose-llm }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: "."
          PYTHONUNBUFFRED: "1"
        run: python -m src.llm_client
      - name: Run PetTron Agent
        env:
          PYTHONPATH: "."
          PYTHONUNBUFFRED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PRIVATE_REPO_FOR_LOG: ${{ secrets.PRIVATE_REPO_FOR_LOG }}
        run: python -m src.main
      - name: Commit updated run state (keep-alive)
        if: always()
        run: |
          git config user.name "pettron-bot[bot]"
          git config user.email "pettron-bot[bot]@users.noreply.github.com"
          git add state/run_state.json config/repos.yaml
          git diff --staged --quiete || git commite -m "chore: pettron daily run state update [skip ci]"
          git pull -- rebase -- autostash || true
          git push
