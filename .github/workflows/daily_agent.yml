name: PetTron Daily Agent

on:
  schedule:
    - cron: '0 6 * * *'   # Runs daily at 6:00 AM UTC (11:00 AM PKT)
  workflow_dispatch:        # Allows manual "Run workflow" button in GitHub UI

jobs:
  run-pettron:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Needed to commit run_state.json back to this repo
      issues: write         # Needed to create private log Issues

    steps:
      # ── 1. Checkout this bot's own repository ──────────────────────────────
      - name: Checkout PetTron repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0    # Full history needed for keep-alive commit check

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run the main agent ──────────────────────────────────────────────
      - name: Run PetTron Agent
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PRIVATE_REPO_FOR_LOG: ${{ secrets.PRIVATE_REPO_FOR_LOG }}
        run: python src/main.py

      # ── 5. Commit updated run state back to this repo ──────────────────────
      # The [skip ci] tag prevents this commit from triggering another run.
      # This commit also acts as a "keep-alive" to prevent GitHub from
      # disabling scheduled workflows after 60 days of inactivity.
      - name: Commit updated run state (keep-alive)
        run: |
          git config user.name "pettron-bot[bot]"
          git config user.email "pettron-bot[bot]@users.noreply.github.com"
          git add state/run_state.json config/repos.yaml
          # Only commit if there are actual staged changes
          git diff --staged --quiet || git commit -m "chore: pettron daily run state update [skip ci]"
          git push

